name: Claude Code Review

on:
  pull_request:
    # No `synchronize`: the code-review plugin stops once Claude has already
    # commented on a PR, so new commits would never be re-reviewed. Comment
    # "@claude review this PR" (claude.yml) to review later commits.
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # The code-review plugin silently stops on draft PRs. Skip them here so a draft
    # never shows a green "review" that did not happen; marking it ready triggers one.
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    # Matches anthropics/claude-code-action examples/pr-review-comprehensive.yml:
    # the review must be able to post inline findings or a summary comment.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Review agents compare against the base branch and read history.
          fetch-depth: 0

      # Comments that already exist (an earlier review or an @claude reply) must not
      # count as this run's result.
      - name: Record review start
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The plugin's eligibility step stopped silently on #43 with no recorded reason.
          # Give it the repository context and make every stop leave an explicit reason.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Context for step 1 (eligibility):
            - This pull request is opened by the repository owner, often through Claude Code, and needs a
              full review. A "Generated with Claude Code" or "Co-Authored-By: Claude" line does not make it
              an automated PR; the plugin itself says to still review Claude-generated PRs.
            - Large or multi-file changes are never "trivial".
            - When checking whether Claude has already commented, count only comments by claude[bot] that
              contain a "## Code review" heading. Ignore "@claude" task replies and comments that start with
              "Claude review skipped:".
            - If you still stop at step 1, first post exactly one PR comment with `gh pr comment` that starts
              with "Claude review skipped:" and names the condition that was true and why.
          # Agent mode grants only these tools. The plugin launches review subagents,
          # reads files and runs the gh commands its command file declares; anything
          # missing is denied silently in CI. Everything here is read-only except the
          # two comment tools.
          claude_args: >-
            --allowedTools "Task,Agent,Read,Glob,Grep,LS,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action reports success even when tools were denied or nothing was posted,
      # so a review that could not run looked identical to a clean review.
      # - Any denied tool call fails the job: the review is incomplete.
      # - No new Claude comment without denials is the plugin's documented preflight stop
      #   (already reviewed, automated or trivial PR): a warning, never a passing "review".
      # Output stays hidden (public repo): only denied tool names and command prefixes print.
      - name: Verify the review actually ran
        if: always() && steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          PR: ${{ github.event.pull_request.number }}
          STARTED_AT: ${{ steps.start.outputs.at }}
        run: |
          set -euo pipefail
          if [ -z "${EXECUTION_FILE}" ] || [ ! -f "${EXECUTION_FILE}" ]; then
            echo "::error::Claude review produced no execution file; no review ran."
            exit 1
          fi
          denials=$(jq '[.[] | select(.type == "result") | .permission_denials // [] | .[]] | length' "${EXECUTION_FILE}")
          if [ "${denials}" != "0" ]; then
            echo "::error::Claude review was denied ${denials} tool call(s); the review is incomplete."
            jq -r '.[] | select(.type == "result") | .permission_denials // [] | .[]
              | "- " + .tool_name + (if .tool_input.command then ": " + (.tool_input.command | .[0:80]) else "" end)' \
              "${EXECUTION_FILE}"
            exit 1
          fi
          new_comments() {
            gh api "repos/${GITHUB_REPOSITORY}/$1/${PR}/comments" --paginate --jq \
              ".[] | select((.user.login == \"claude[bot]\" or .user.login == \"claude\")
                and ((.created_at >= \"${STARTED_AT}\") or (.updated_at >= \"${STARTED_AT}\"))) | .id" | wc -l | tr -d ' '
          }
          skipped=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq \
            ".[] | select((.user.login == \"claude[bot]\" or .user.login == \"claude\")
              and (.created_at >= \"${STARTED_AT}\") and (.body | startswith(\"Claude review skipped:\")))
              | .body | split(\"\\n\")[0] | .[0:300]")
          if [ -n "${skipped}" ]; then
            echo "::warning::${skipped}"
            { echo "### Claude review skipped — not a review result"; echo; echo "${skipped}"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          comments=$(new_comments issues)
          inline=$(new_comments pulls)
          if [ "${comments}" = "0" ] && [ "${inline}" = "0" ]; then
            echo "::warning::Claude posted nothing in this run: the plugin's preflight skipped this PR (already reviewed, automated or trivial). This is not a review; comment '@claude review this PR' to request one."
            echo "### Claude review skipped by plugin preflight — no review result for this run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Claude review posted ${comments} comment(s) and ${inline} inline comment(s) in this run."
