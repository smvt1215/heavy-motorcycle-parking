name: Claude Code Review

on:
  pull_request:
    # No `synchronize`: the code-review plugin stops once Claude has already
    # commented on a PR, so new commits would never be re-reviewed. Comment
    # "@claude review this PR" (claude.yml) to review later commits.
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # The code-review plugin silently stops on draft PRs. Skip them here so a draft
    # never shows a green "review" that did not happen; marking it ready triggers one.
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    # Matches anthropics/claude-code-action examples/pr-review-comprehensive.yml:
    # the review must be able to post inline findings or a summary comment.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Review agents compare against the base branch and read history.
          fetch-depth: 0

      # Comments that already exist (an earlier review or an @claude reply) must not
      # count as this run's result.
      - name: Record review start
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The plugin's eligibility step stopped silently on #43 with no recorded reason.
          # Give it the real author relationship and make every stop leave an explicit reason.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Context for step 1 (eligibility):
            - PR author: ${{ github.event.pull_request.user.login }} (account type ${{ github.event.pull_request.user.type }}, author association ${{ github.event.pull_request.author_association }}).
            - If the author association is OWNER, MEMBER or COLLABORATOR and the account type is User, the PR was
              opened by a maintainer, often through Claude Code, and needs a full review: a "Generated with Claude
              Code" or "Co-Authored-By: Claude" line does not make it an automated PR (the plugin itself says to
              still review Claude-generated PRs). Otherwise apply the plugin's rules unchanged.
            - Large or multi-file changes are never "trivial".
            - Claude has already reviewed this PR only if claude[bot] or claude posted a comment containing a
              "## Code review" heading or inline pull-request review comments. "@claude" task replies and
              comments that start with "Claude review skipped:" do not count.
            - In the step-1 eligibility subagent, inspect summary comments with `gh pr view --comments` and
              run this paginated read before deciding whether a prior review exists:
              gh api --method GET repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate --jq '.[] | select(.user.login == "claude[bot]" or .user.login == "claude") | {id, body, created_at}'
              `gh pr view --comments` omits inline findings. The API query includes prior Claude inline
              comments from every page; they count as an existing review regardless of their timestamp.
            - If you still stop at step 1, first post exactly one PR comment with `gh pr comment` that starts
              with "Claude review skipped:" and names the condition that was true and why.
          # Agent mode grants only these tools. The plugin launches review subagents,
          # reads files and runs the gh commands its command file declares; anything
          # missing is denied silently in CI. Everything here is read-only except the
          # two comment tools.
          claude_args: >-
            --allowedTools "Task,Agent,Read,Glob,Grep,LS,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api --method GET repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action reports success even when tools were denied, a skip was stated or
      # nothing was posted. Pass only when this run posted a review (summary or inline
      # findings) without denied tools; everything else fails and says why. This job is not
      # a required check, so a red result marks "not reviewed" without blocking merges.
      # Decision logic: .github/scripts/verify_claude_review.py (tested in backend/tests).
      - name: Verify the review actually ran
        if: always() && steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          PR: ${{ github.event.pull_request.number }}
          STARTED_AT: ${{ steps.start.outputs.at }}
        run: |
          set -euo pipefail
          if [ -z "${EXECUTION_FILE}" ] || [ ! -f "${EXECUTION_FILE}" ]; then
            echo "::error::Claude review produced no execution file; no review ran."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq '.[]' | jq -s '.' > "${RUNNER_TEMP}/issue-comments.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments" --paginate --jq '.[]' | jq -s '.' > "${RUNNER_TEMP}/review-comments.json"
          python3 .github/scripts/verify_claude_review.py "${EXECUTION_FILE}" \
            "${RUNNER_TEMP}/issue-comments.json" "${RUNNER_TEMP}/review-comments.json" "${STARTED_AT}"
