name: heavy_parking
description: 重機停車通 - Heavy Motorcycle Parking
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  dynamic_color: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.2
  mockito: ^5.4.4
  fake_async: ^1.3.3
  shared_preferences_platform_interface: ^2.4.2

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
